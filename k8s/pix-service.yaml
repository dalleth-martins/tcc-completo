apiVersion: v1
kind: ConfigMap
metadata:
  name: pix-service-config
data:
  SPRING_MONGODB_URI: "mongodb://admin:admin123@mongodb:27017/pix_db?authSource=admin"
  SPRING_RABBITMQ_HOST: "rabbitmq"
  OTLP_TRACING_ENDPOINT: "http://host.minikube.internal:4318/v1/traces"
  MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pix-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pix-service
  template:
    metadata:
      labels:
        app: pix-service
    spec:
      containers:
        - name: pix-service
          image: pix-service:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
          envFrom:
            - configMapRef:
                name: pix-service-config
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 768Mi
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8081
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8081
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8081
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: pix-service
spec:
  selector:
    app: pix-service
  ports:
    - port: 8081
      targetPort: 8081
