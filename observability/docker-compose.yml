# Stack de observabilidade do TCC: Prometheus (métricas) + Tempo (traces) + Grafana (visualização).
# Os microsserviços rodam na máquina (IntelliJ/Gradle); o Prometheus os acessa por host.docker.internal.
# Uso: docker compose up -d   (dentro desta pasta)

services:
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: tcc-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Ajusta a permissão do volume do Tempo (o Tempo roda com o usuário 10001)
  tempo-init:
    image: grafana/tempo:2.6.1
    container_name: tcc-tempo-init
    user: root
    entrypoint:
      - "chown"
      - "-R"
      - "10001:10001"
      - "/var/tempo"
    volumes:
      - tempo_data:/var/tempo

  tempo:
    image: grafana/tempo:2.6.1
    container_name: tcc-tempo
    restart: unless-stopped
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    depends_on:
      tempo-init:
        condition: service_completed_successfully
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP  <- os serviços enviam os traces para cá
      - "3200:3200"   # API de consulta (usada pelo Grafana)
    volumes:
      - ./tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo_data:/var/tempo

  grafana:
    image: grafana/grafana:11.3.0
    container_name: tcc-grafana
    restart: unless-stopped
    depends_on:
      - prometheus
      - tempo
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana

volumes:
  prometheus_data:
  tempo_data:
  grafana_data:
